      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  runtime-1-data:
    driver: local
  runtime-1-config:
    driver: local
  runtime-2-data:
    driver: local
  runtime-2-config:
    driver: local
  runtime-3-data:
    driver: local
  runtime-3-config:
    driver: local